jwt:
  # 테스트 전용 HMAC 비밀키 지정
  secret: test-jwt-secret-must-be-longer-than-thirty-two-bytes
  cookie:
    # MockMvc HTTP 테스트에서 Cookie 전달 허용
    secure: false

cors:
  # CORS MVC 테스트에서 사용할 로컬 프런트 Origin 지정
  allowed-origins: http://localhost:3000

spring:
  security:
    oauth2:
      client:
        registration:
          kakao:
            # OAuth2 로그인 시작 경로 리다이렉트 검증에만 사용할 가짜 Client ID 지정
            client-id: test-kakao-rest-api-key
            client-secret: test-kakao-client-secret
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
