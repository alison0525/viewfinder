spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/viewfinder}
    username: ${DB_USERNAME:viewfinder}
    password: ${DB_PASSWORD:viewfinder}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      # 테이블 생성·변경은 Flyway SQL만 담당하고, Hibernate는 Entity와 DB 구조 일치 여부만 확인
      ddl-auto: validate
    show-sql: true
