spring:
  config:
    # backend/.env의 Git 미추적 비밀값을 Java Properties 형식으로 선택적 import
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/viewfinder}
    username: ${DB_USERNAME:viewfinder}
    password: ${DB_PASSWORD:viewfinder}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      # 테이블 생성·변경은 Flyway SQL만 담당하고, Hibernate는 Entity와 DB 구조 일치 여부만 확인
      ddl-auto: validate
    show-sql: true

jwt:
  # 로컬 실행 환경에서 주입한 HMAC 비밀키 사용
  secret: ${JWT_SECRET}
  cookie:
    # localhost HTTP 개발 환경에서도 Cookie 전달 허용
    secure: false

cors:
  # Next.js 기본 로컬 개발 주소를 허용하고 필요하면 backend/.env의 CORS_ALLOWED_ORIGINS로 교체
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
