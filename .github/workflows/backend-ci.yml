name: Backend CI

on:
  pull_request:
    branches: [dev]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # GitHub 제공 Ubuntu 실행 환경. Docker가 기본 제공되어 Testcontainers 실행 가능
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Run tests
        # Testcontainers의 PostGIS 기동 → 테스트 실행 순서 수행
        run: ./gradlew test
