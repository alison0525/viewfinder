name: Backend CI

on:
  pull_request:
    branches: [dev]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # GitHub 제공 Ubuntu 실행 환경. Docker가 기본 제공되어 Testcontainers 실행 가능
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Run quality checks and tests
        # Checkstyle 정적 검사 후 Testcontainers PostGIS 기반 테스트·JaCoCo 리포트 생성
        run: ./gradlew check
      - name: Upload test and coverage reports
        # 실패한 PR도 원인 확인이 가능하도록 테스트·커버리지 HTML/XML 리포트 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-quality-reports
          path: |
            backend/build/reports/tests
            backend/build/reports/jacoco
          if-no-files-found: warn
